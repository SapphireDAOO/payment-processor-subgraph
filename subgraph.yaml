specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SimplePaymentProcessor
    network: localhost
    source:
      abi: SimplePaymentProcessor
      address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
      startBlock: 0
    mapping:
      kind: ethereum
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SimplePaymentProcessor
        - InvoiceEvent
      abis:
        - name: SimplePaymentProcessor
          file: ./abis/SimplePaymentProcessor.json
        - name: PaymentProcessorStorage
          file: ./abis/PaymentProcessorStorage.json
      eventHandlers:
        - event: InvoiceAccepted(indexed uint216)
          handler: handleInvoiceAccepted
        - event: InvoiceCanceled(indexed uint216)
          handler: handleInvoiceCanceled
        - event: InvoiceCreated(indexed
            uint216,(uint216,uint40,uint40,uint40,uint40,uint40,uint8,uint8,address,address,address,uint256,uint256))
          handler: handleInvoiceCreated
        - event: InvoicePaid(indexed uint216,indexed address,indexed uint256,uint40)
          handler: handleInvoicePaid
        - event: InvoiceRefunded(indexed uint216)
          handler: handleInvoiceRefunded
        - event: InvoiceRejected(indexed uint216)
          handler: handleInvoiceRejected
        - event: InvoiceReleased(indexed uint216)
          handler: handleInvoiceReleased
        - event: LockedPaymentRecovered(indexed uint216,indexed address,uint256)
          handler: handleLockedPaymentRecovered
        - event: TransferFailed(indexed uint216,indexed address,uint256)
          handler: handleTransferFailed
        - event: UpdateHoldPeriod(indexed uint216,indexed uint256)
          handler: handleHoldPeriod
        - event: WithdrawalRetried(indexed uint216,indexed address,uint256,uint8)
          handler: handleWithdrawalRetried
      file: ./src/simple-payment-processor.ts
  - kind: ethereum
    name: AdvancedPaymentProcessor
    network: localhost
    source:
      abi: AdvancedPaymentProcessor
      address: "0xa513E6E4b8f2a923D98304ec87F64353C4D5C853"
      startBlock: 0
    mapping:
      kind: ethereum
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AdvancedPaymentProcessor
        - MetaInvoice
        - InvoiceEvent
        - PaymentToken
      abis:
        - name: AdvancedPaymentProcessor
          file: ./abis/AdvancedPaymentProcessor.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: PaymentProcessorStorage
          file: ./abis/PaymentProcessorStorage.json
      eventHandlers:
        - event: InvoiceCreated(indexed
            uint216,(uint216,uint40,uint40,uint40,uint40,uint8,uint8,uint32,uint216,address,address,address,address,uint256,uint256,uint256))
          handler: handleAdvancedPaymentProcessorCreated
        - event: InvoicePaid(indexed uint216,address,address,uint256,uint40)
          handler: handleInvoicePaid
        - event: InvoiceCanceled(indexed uint216)
          handler: handleInvoiceCanceled
        - event: DisputeCreated(indexed uint216)
          handler: handleDisputeCreated
        - event: DisputeDismissed(indexed uint216)
          handler: handleDisputeDismissed
        - event: DisputeResolved(indexed uint216)
          handler: handleDisputeResolved
        - event: DisputeSettled(indexed uint216,uint256,uint256)
          handler: handleDisputeSettled
        - event: EscrowCreated(indexed uint216,indexed address)
          handler: handleEscrowCreated
        - event: LockedPaymentRecovered(indexed uint216,indexed address,uint256)
          handler: handleLockedPaymentRecovered
        - event: MetaInvoiceCreated(indexed uint216,indexed uint256)
          handler: handleMetaInvoiceCreated
        - event: OracleUpdated(indexed address,indexed address)
          handler: handleOracleUpdated
        - event: PaymentReleased(indexed uint216,address,address,uint256)
          handler: handlePaymentReleased
        - event: Refunded(indexed uint216,indexed uint256)
          handler: handleRefunded
        - event: TransferFailed(indexed uint216,indexed address,uint256)
          handler: handleTransferFailed
        - event: UpdateReleaseTime(indexed uint216,uint256)
          handler: handleUpdateReleaseTime
        - event: WithdrawalRetried(indexed uint216,indexed address,uint256,uint8)
          handler: handleWithdrawalRetried
      file: ./src/advanced-payment-processor.ts
  - kind: ethereum
    name: Notes
    network: localhost
    source:
      abi: Notes
      address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Note
        - NoteOpenState
      abis:
        - name: Notes
          file: ./abis/Notes.json
      eventHandlers:
        - event: NoteCreated(indexed uint216,indexed uint256,indexed address,bool,bytes)
          handler: handleNoteCreated
        - event: NoteStateChanged(indexed uint216,indexed uint256,indexed address,bool)
          handler: handleNoteStateChanged
      file: ./src/notes.ts
  - kind: ethereum
    name: MultiSig
    network: localhost
    source:
      abi: MultiSig
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MultiSigWallet
        - MultiSigSigner
        - MultiSigTransaction
        - MultiSigApproval
      abis:
        - name: MultiSig
          file: ./abis/MultiSig.json
      eventHandlers:
        - event: SignerAdded(indexed address)
          handler: handleSignerAdded
        - event: SignerRemoved(indexed address)
          handler: handleSignerRemoved
        - event: ThresholdUpdated(uint256,uint256)
          handler: handleThresholdUpdated
        - event: TransactionProposed(indexed bytes32,indexed address,uint256,bytes,uint256,indexed address)
          handler: handleTransactionProposed
        - event: ApprovalAdded(indexed bytes32,indexed address,uint256)
          handler: handleApprovalAdded
        - event: TransactionApproved(indexed bytes32)
          handler: handleTransactionApproved
        - event: TransactionCanceled(indexed bytes32)
          handler: handleTransactionCanceled
        - event: TransactionExecuted(indexed bytes32,indexed address)
          handler: handleTransactionExecuted
      file: ./src/multi-sig.ts
  - kind: ethereum
    name: OracleManager
    network: localhost
    source:
      abi: OracleManager
      address: "0x0165878A594ca255338adfa4d48449f69242Eb8F"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PaymentToken
      abis:
        - name: OracleManager
          file: ./abis/OracleManager.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: PriceFeedSet(indexed address,indexed address,uint96)
          handler: handlePriceFeedSet
      file: ./src/oracle-manager.ts
