enum SimplePaymentProcessorState {
  CREATED
  PAID
  ACCEPTED
  CANCELED
  RELEASED
  REJECTED
  REFUNDED
}

enum AdvancedPaymentProcessorState {
  CREATED
  PAID
  CANCELED
  DISPUTED
  DISPUTE_DISMISSED
  DISPUTE_RESOLVED
  DISPUTE_SETTLED
  REFUNDED
  RELEASED
}

enum PaymentProcessorEventType {
  DISPUTE_CREATED
  DISPUTE_DISMISSED
  DISPUTE_RESOLVED
  DISPUTE_SETTLED
  ESCROW_CREATED
  INVOICE_ACCEPTED
  INVOICE_CANCELED
  INVOICE_CREATED
  INVOICE_PAID
  INVOICE_REFUNDED
  INVOICE_REJECTED
  INVOICE_RELEASED
  LOCKED_PAYMENT_RECOVERED
  META_INVOICE_CREATED
  ORACLE_UPDATED
  PAYMENT_RELEASED
  REFUNDED
  TRANSFER_FAILED
  UPDATE_HOLD_PERIOD
  UPDATE_RELEASE_TIME
  WITHDRAWAL_RETRIED
}

enum MultisigStatus {
  PROPOSED
  APPROVED
  CANCELED
  EXECUTED
}

enum InvoiceType {
  SIMPLE
  ADVANCED
}

enum UserRole {
  CREATOR
  PAYER
}

type InvoiceEvent @entity(immutable: true) {
  id: ID!
  eventType: PaymentProcessorEventType!
  txHash: Bytes!
  timestamp: BigInt!
  simpleInvoice: SimplePaymentProcessor
  advancedInvoice: AdvancedPaymentProcessor
}

type User @entity(immutable: false) {
  id: ID!
  # UTC day index (timestamp / 86400) of the user's most recent observed
  # activity; used to emit at most one ActiveUser point per user per day.
  lastActiveDay: BigInt
  ownedSimpleInvoices: [SimplePaymentProcessor!]! @derivedFrom(field: "seller")
  paidSimpleInvoices: [SimplePaymentProcessor!]! @derivedFrom(field: "buyer")
  issuedAdvancedInvoices: [AdvancedPaymentProcessor!]!
    @derivedFrom(field: "seller")
  receivedAdvancedInvoices: [AdvancedPaymentProcessor!]!
    @derivedFrom(field: "buyer")
  metaInvoices: [MetaInvoice!]! @derivedFrom(field: "buyer")
}

# commission url is
type SimplePaymentProcessor @entity(immutable: false) {
  id: ID!
  invoiceNonce: BigInt!
  state: SimplePaymentProcessorState!
  seller: User!
  buyer: User
  price: BigInt!
  amountPaid: BigInt
  expiresAt: BigInt
  sellerActionDeadline: BigInt
  releaseAt: BigInt
  fee: BigInt
  feeReceiver: Bytes
  # Tx in which the best-effort fee payout failed; the fee was not credited.
  feeTransferFailedTx: Bytes
  contract: Bytes!
  events: [InvoiceEvent!]! @derivedFrom(field: "simpleInvoice")
  lastActionTime: BigInt
  buyerNote: String
  sellerNote: String
}

# commission url is either in release or dispute
type AdvancedPaymentProcessor @entity(immutable: false) {
  id: ID!
  invoiceNonce: BigInt!
  state: AdvancedPaymentProcessorState!
  buyer: User
  seller: User!
  price: BigInt!
  escrow: Bytes
  balance: BigInt
  paymentToken: PaymentToken
  releaseAt: BigInt
  amountReleased: BigInt
  amountRefunded: BigInt
  sellerAmountReceivedAfterDispute: BigInt
  buyerAmountReceivedAfterDispute: BigInt
  amountPaid: BigInt
  contract: Bytes!
  events: [InvoiceEvent!]! @derivedFrom(field: "advancedInvoice")
  fee: BigInt
  feeReceiver: Bytes
  # Tx in which the best-effort fee payout failed; the fee was not credited.
  feeTransferFailedTx: Bytes
  lastActionTime: BigInt
  metaInvoice: MetaInvoice
  buyerNote: String
  sellerNote: String
}

type MetaInvoice @entity(immutable: false) {
  id: ID!
  invoiceNonce: BigInt!
  buyer: User!
  price: BigInt!
  contract: Bytes!
  invoices: [AdvancedPaymentProcessor!]! @derivedFrom(field: "metaInvoice")
}

type PaymentToken @entity(immutable: false) {
  id: ID!
  name: String
  decimal: Int
}

type Note @entity(immutable: true) {
  id: ID!
  invoiceId: BigInt!
  noteId: BigInt!
  author: Bytes!
  share: Boolean!
  encryptedContent: Bytes!
  createdAtBlock: BigInt!
  createdAtTx: Bytes!
}

type NoteOpenState @entity(immutable: false) {
  id: ID!
  invoiceId: BigInt!
  noteId: BigInt!
  user: Bytes!
  opened: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

type MultiSigWallet @entity(immutable: false) {
  id: ID! # contract address
  threshold: BigInt!
  signerCount: BigInt!
  transactionCount: BigInt!
  signers: [MultiSigSigner!]! @derivedFrom(field: "wallet")
  transactions: [MultiSigTransaction!]! @derivedFrom(field: "wallet")
}

type MultiSigSigner @entity(immutable: false) {
  id: ID! # wallet address + "-" + signer address
  wallet: MultiSigWallet!
  address: Bytes!
  active: Boolean!
  addedAt: BigInt!
  removedAt: BigInt
  approvals: [MultiSigApproval!]! @derivedFrom(field: "signer")
}

type MultiSigTransaction @entity(immutable: false) {
  id: Bytes! # txHash
  wallet: MultiSigWallet!
  target: Bytes!
  value: BigInt!
  data: Bytes!
  nonce: BigInt!
  proposer: Bytes!
  status: MultisigStatus!
  approvalCount: BigInt!
  proposedAt: BigInt!
  executedAt: BigInt
  executor: Bytes
  approvals: [MultiSigApproval!]! @derivedFrom(field: "transaction")
}

type MultiSigApproval @entity(immutable: false) {
  id: ID! # txHash + "-" + approver
  transaction: MultiSigTransaction!
  signer: MultiSigSigner
  approver: Bytes!
  approvalCount: BigInt!
  approvedAt: BigInt!
}

# Singleton (id: "global") mirroring the current PaymentProcessorStorage
# configuration. Updated by every config-changing storage event.
type StorageConfiguration @entity(immutable: false) {
  id: ID!
  owner: Bytes
  feeRate: BigInt
  feeReceiver: Bytes
  defaultHoldPeriod: BigInt
  marketplace: Bytes
  gasThreshold: BigInt
  paymentValidityDuration: BigInt
  updatedAt: BigInt
  updatedAtBlock: BigInt
}

# Per-account authorization state managed via setAuthorizedAddress
# (id: account address).
type AuthorizedAddress @entity(immutable: false) {
  id: ID!
  account: Bytes!
  authorized: Boolean!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
}

type FeeReceiver @entity(immutable: false) {
  id: ID!
  address: Bytes!
  balances: [FeeReceiverTokenBalance!]! @derivedFrom(field: "feeReceiver")
  sweeps: [FeeSweep!]! @derivedFrom(field: "feeReceiver")
  # Number of Swept transfers out of this receiver, across all tokens.
  sweepCount: BigInt!
  firstCreditedAt: BigInt
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
}

type FeeReceiverTokenBalance @entity(immutable: false) {
  id: ID!
  feeReceiver: FeeReceiver!
  token: PaymentToken!
  # Cumulative fees credited to this receiver in this token.
  accrued: BigInt!
  # Cumulative amount swept out by the Sweeper.
  swept: BigInt!
  # accrued - swept: what the receiver still holds from platform fees.
  balance: BigInt!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
}

# One Sweeper transfer moving a fee receiver's tokens to a destination.
type FeeSweep @entity(immutable: true) {
  id: ID!
  feeReceiver: FeeReceiver!
  token: PaymentToken!
  destination: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  block: BigInt!
  txHash: Bytes!
}

# Gas Tracker — cumulative platform-wallet gas spend (id: "global")
type GasPaid @entity(immutable: false) {
  id: ID!
  amount: BigInt!
  transactionCount: BigInt!
  lastTimeStamp: BigInt!
}

type PaymentVolume @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  token: PaymentToken!
  amount: BigInt!
}

type VolumeStats @aggregation(intervals: ["day"], source: "PaymentVolume") {
  id: Int8!
  timestamp: Timestamp!
  token: PaymentToken!
  dailyVolume: BigInt! @aggregate(fn: "sum", arg: "amount")
  invoicePaid: BigInt! @aggregate(fn: "count", cumulative: true)
}

type EscrowBalance @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  token: PaymentToken!
  balance: BigInt!
  amountPaid: BigInt!
}

type EscrowStat
  @aggregation(intervals: ["hour", "day"], source: "EscrowBalance") {
  id: Int8!
  timestamp: Timestamp!
  token: PaymentToken!
  totalBalance: BigInt! @aggregate(fn: "sum", arg: "balance")
  totalAmountPaid: BigInt! @aggregate(fn: "sum", arg: "amountPaid")
}

type FeePaid @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  token: PaymentToken!
  amount: BigInt!
  txHash: Bytes!
}

type FeePaidStats @aggregation(intervals: ["day"], source: "FeePaid") {
  id: Int8!
  timestamp: Timestamp!
  token: PaymentToken!
  totalFeePaid: BigInt! @aggregate(fn: "sum", arg: "amount")
}

type InvoiceActivity @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  invoiceType: InvoiceType!
}

type InvoiceActivityStats
  @aggregation(intervals: ["day"], source: "InvoiceActivity") {
  id: Int8!
  timestamp: Timestamp!
  invoiceType: InvoiceType!
  totalActivity: BigInt! @aggregate(fn: "count", cumulative: true)
}

type NewUser @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  user: Bytes!
  role: UserRole!
}

type NewUserStats @aggregation(intervals: ["day"], source: "NewUser") {
  id: Int8!
  timestamp: Timestamp!
  role: UserRole!
  # Per-day additions (sum the last 7 buckets for the dashboard's 7-day figure).
  newUsers: BigInt! @aggregate(fn: "count")
  # Cumulative running total of new users by role.
  totalUsers: BigInt! @aggregate(fn: "count", cumulative: true)
}

type ActiveUser @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  user: Bytes!
  role: UserRole!
}

type ActiveUserStats @aggregation(intervals: ["day"], source: "ActiveUser") {
  id: Int8!
  timestamp: Timestamp!
  activeUsers: BigInt! @aggregate(fn: "count")
}
