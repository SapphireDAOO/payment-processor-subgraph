specVersion: 1.1.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SimplePaymentProcessor
    network: {{network}}
    source:
      abi: SimplePaymentProcessor
      address: "{{simplePaymentProcessor.address}}"
      startBlock: {{simplePaymentProcessor.startBlock}}
    mapping:
      kind: ethereum
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SimplePaymentProcessor
        - InvoiceEvent
        - FeeReceiver
        - FeeReceiverTokenBalance
        - PaymentToken
      abis:
        - name: SimplePaymentProcessor
          file: ./abis/SimplePaymentProcessor.json
        - name: PaymentProcessorStorage
          file: ./abis/PaymentProcessorStorage.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: InvoiceAccepted(indexed uint216,indexed address,uint40)
          handler: handleInvoiceAccepted
        - event: InvoiceCanceled(indexed uint216)
          handler: handleInvoiceCanceled
        - event: InvoiceCreated(indexed
            uint216,(uint216,uint40,uint40,uint40,uint40,uint40,uint32,uint8,uint8,uint16,address,address,address,address,uint256,uint256))
          handler: handleInvoiceCreated
        - event: InvoicePaid(indexed uint216,indexed address,indexed uint256,uint40)
          handler: handleInvoicePaid
        - event: InvoiceRefunded(indexed uint216,uint256)
          handler: handleInvoiceRefunded
        - event: InvoiceRejected(indexed uint216,uint256)
          handler: handleInvoiceRejected
        - event: InvoiceReleased(indexed uint216,uint256,uint256)
          handler: handleInvoiceReleased
        - event: TransferFailed(indexed uint216,indexed address,uint256)
          handler: handleTransferFailed
        - event: WithdrawalRetried(indexed uint216,indexed address,uint256,uint8)
          handler: handleWithdrawalRetried
      file: ./src/simple-payment-processor.ts
  - kind: ethereum
    name: AdvancedPaymentProcessor
    network: {{network}}
    source:
      abi: AdvancedPaymentProcessor
      address: "{{advancedPaymentProcessor.address}}"
      startBlock: {{advancedPaymentProcessor.startBlock}}
    mapping:
      kind: ethereum
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AdvancedPaymentProcessor
        - MetaInvoice
        - InvoiceEvent
        - PaymentToken
        - FeeReceiver
        - FeeReceiverTokenBalance
      abis:
        - name: AdvancedPaymentProcessor
          file: ./abis/AdvancedPaymentProcessor.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: PaymentProcessorStorage
          file: ./abis/PaymentProcessorStorage.json
      eventHandlers:
        - event: InvoiceCreated(indexed
            uint216,(uint216,uint40,uint40,uint40,uint40,uint8,uint8,uint32,uint16,uint216,address,address,address,address,address,uint256,uint256,uint256))
          handler: handleAdvancedPaymentProcessorCreated
        - event: InvoicePaid(indexed uint216,address,address,uint256,uint40,address)
          handler: handleInvoicePaid
        - event: InvoiceCanceled(indexed uint216)
          handler: handleInvoiceCanceled
        - event: DisputeCreated(indexed uint216)
          handler: handleDisputeCreated
        - event: DisputeDismissed(indexed uint216)
          handler: handleDisputeDismissed
        - event: DisputeResolved(indexed uint216)
          handler: handleDisputeResolved
        - event: DisputeSettled(indexed uint216,uint256,uint256,uint256)
          handler: handleDisputeSettled
        - event: EscrowCreated(indexed uint216,indexed address)
          handler: handleEscrowCreated
        - event: LockedPaymentRecovered(indexed uint216,indexed address,uint256)
          handler: handleLockedPaymentRecovered
        - event: MetaInvoiceCreated(indexed uint216,indexed uint256)
          handler: handleMetaInvoiceCreated
        - event: OracleUpdated(indexed address,indexed address)
          handler: handleOracleUpdated
        - event: PaymentReleased(indexed uint216,address,address,uint256,uint256)
          handler: handlePaymentReleased
        - event: PaymentTokensRegistered(indexed uint216,address[])
          handler: handlePaymentTokensRegistered
        - event: Refunded(indexed uint216,indexed uint256)
          handler: handleRefunded
        - event: TransferFailed(indexed uint216,indexed address,uint256)
          handler: handleTransferFailed
        - event: UpdateReleaseTime(indexed uint216,uint256)
          handler: handleUpdateReleaseTime
      file: ./src/advanced-payment-processor.ts
  - kind: ethereum
    name: PaymentProcessorStorage
    network: {{network}}
    source:
      abi: PaymentProcessorStorage
      address: "{{paymentProcessorStorage.address}}"
      startBlock: {{paymentProcessorStorage.startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - StorageConfiguration
        - AuthorizedAddress
      abis:
        - name: PaymentProcessorStorage
          file: ./abis/PaymentProcessorStorage.json
      eventHandlers:
        - event: AuthorizationUpdated(indexed address,bool)
          handler: handleAuthorizationUpdated
        - event: ConfigurationInitialized((address,uint96,address,address,uint96))
          handler: handleConfigurationInitialized
        - event: FeeRateUpdated(uint96)
          handler: handleFeeRateUpdated
        - event: FeeReceiverUpdated(indexed address)
          handler: handleFeeReceiverUpdated
        - event: GasThresholdUpdated(uint96)
          handler: handleGasThresholdUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: PaymentValidityDurationUpdated(uint256)
          handler: handlePaymentValidityDurationUpdated
      file: ./src/payment-processor-storage.ts
  - kind: ethereum
    name: Notes
    network: {{network}}
    source:
      abi: Notes
      address: "{{notes.address}}"
      startBlock: {{notes.startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Note
        - NoteOpenState
        - User
      abis:
        - name: Notes
          file: ./abis/Notes.json
      eventHandlers:
        - event: NoteCreated(indexed uint216,indexed uint256,indexed address,bool,bytes)
          handler: handleNoteCreated
        - event: NoteStateChanged(indexed uint216,indexed uint256,indexed address,bool)
          handler: handleNoteStateChanged
        - event: PublicKeySet(indexed address,bytes,uint8)
          handler: handlePublicKeySet
      file: ./src/notes.ts
  - kind: ethereum
    name: MultiSig
    network: {{network}}
    source:
      abi: MultiSig
      address: "{{multiSig.address}}"
      startBlock: {{multiSig.startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MultiSigWallet
        - MultiSigSigner
        - MultiSigTransaction
        - MultiSigApproval
      abis:
        - name: MultiSig
          file: ./abis/MultiSig.json
      eventHandlers:
        - event: SignerAdded(indexed address)
          handler: handleSignerAdded
        - event: SignerRemoved(indexed address)
          handler: handleSignerRemoved
        - event: ThresholdUpdated(uint256,uint256)
          handler: handleThresholdUpdated
        - event: TransactionProposed(indexed bytes32,indexed address,uint256,bytes,uint256,indexed address)
          handler: handleTransactionProposed
        - event: ApprovalAdded(indexed bytes32,indexed address,uint256)
          handler: handleApprovalAdded
        - event: TransactionApproved(indexed bytes32)
          handler: handleTransactionApproved
        - event: TransactionCanceled(indexed bytes32)
          handler: handleTransactionCanceled
        - event: TransactionExecuted(indexed bytes32,indexed address)
          handler: handleTransactionExecuted
      file: ./src/multi-sig.ts
  - kind: ethereum
    name: OracleManager
    network: {{network}}
    source:
      abi: OracleManager
      address: "{{oracleManager.address}}"
      startBlock: {{oracleManager.startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PaymentToken
      abis:
        - name: OracleManager
          file: ./abis/OracleManager.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: PriceFeedSet(indexed address,indexed address,uint96)
          handler: handlePriceFeedSet
      file: ./src/oracle-manager.ts
  - kind: ethereum
    name: Sweeper
    network: {{network}}
    source:
      abi: Sweeper
      address: "{{sweeper.address}}"
      startBlock: {{sweeper.startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FeeReceiver
        - FeeReceiverTokenBalance
        - FeeSweep
        - PaymentToken
      abis:
        - name: Sweeper
          file: ./abis/Sweeper.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Swept(indexed address,indexed address,indexed address,uint256)
          handler: handleSwept
      file: ./src/sweeper.ts
